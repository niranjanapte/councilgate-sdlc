name: Polyglot Multi-Persona SDLC Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  nextjs-pipeline:
    name: Next.js Frontend Pipeline (Jest & Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: DevOps Lint Check (ESLint)
        run: npm run lint

      - name: QA Unit Verification (Jest 85% Gate)
        run: npm run test

  python-pipeline:
    name: Python Backend Pipeline (PyTest 85% Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov flake8 black

      - name: DevOps Style & Quality Audit (Flake8 / Black)
        run: |
          black --check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: QA Test Verification (PyTest 85% Fail Gate)
        run: pytest --cov=src --cov-report=term-missing

