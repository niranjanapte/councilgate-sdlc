[pytest]
minversion = 7.0
# 🛡️ Root-Level Constraint: Tell PyTest exactly where the backend lives
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Force coverage targeting strictly inside the backend source folder
addopts = 
    --strict-markers
    --cov=backend/src
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=85

# Prevent PyTest from accidentally crawling unrelated text/node assets
norecursedirs = .git .ai-agency docs frontend node_modules venv

